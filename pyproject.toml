[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "waifuboard"
dynamic = ["version"]
description = "Asynchronous API for downloading images, tags, and metadata from image board sites (e.g., Danbooru, Safebooru, Yandere). Ignore the downloaded files."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "ChijiangZhai", email = "chijiangzhai@gmail.com" }]
maintainers = [{ name = "ChijiangZhai", email = "chijiangzhai@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet",
]
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
keywords = [
    "python",
    "acg",
    "crawler",
    "spider",
    "ai",
    "imageboard",
    "danbooru",
    "safebooru",
    "yandere",
    "images",
    "pictures",
    "tags",
    "prompt",
    "metadata",
]
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncstdlib>=3.14.0",
    "fake-useragent>=2.2.0",
    "niquests[full]>=3.21.0",
    "orjson>=3.11.9",
    "pandas>=2.3.3,<3; python_version < '3.11'",
    "pandas>=3.0.5; python_version >= '3.11'",
    "parsel>=1.11.0",
    "pre-commit>=4.6.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
]

[project.urls]
Homepage = "https://github.com/2513502304/WaifuBoard"
# Documentation = "https://waifuboard.readthedocs.io/"
Repository = "https://github.com/2513502304/WaifuBoard.git"
Issues = "https://github.com/2513502304/WaifuBoard/issues"
# Changelog = "https://github.com/2513502304/WaifuBoard/blob/master/CHANGELOG.md"

[tool.setuptools]

[tool.setuptools.dynamic]
version = {attr = "waifuboard.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["waifuboard*"]
exclude = ["tests*", "examples*", "scripts*", "downloads*"]
